services:
  - type: web
    name: noteforge-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: TAVILY_API_KEY
        sync: false          # Set in Render dashboard
    autoDeploy: true
